name: Jetpack Compose Performance Review

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches: [ '*' ]
    paths:
      - '**/*.kt'
      - '.github/workflows/compose_performance_skill.yml'
      - '.github/scripts/compose_performance_review.js'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review (leave empty to review the latest commit)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-performance-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'android/snippets' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.fork == false && github.event.pull_request.draft == false))

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        token: ${{ secrets.PAT || github.token }}
        # Check out the PR head (not the merge commit) so reported line numbers match the PR diff.
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Prepare Review Context
      id: context
      env:
        GH_TOKEN: ${{ secrets.PAT || github.token }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if [[ -n "${PR_NUMBER}" ]]; then
          if [[ -z "${BASE_REF}" ]]; then
            BASE_REF=$(gh pr view "${PR_NUMBER}" --json baseRefName --jq '.baseRefName')
            gh pr checkout "${PR_NUMBER}"
            git fetch origin "${BASE_REF}"
          fi
          DIFF_RANGE="origin/${BASE_REF}...HEAD"
          echo "mode=pr" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
        else
          DIFF_RANGE="HEAD~1...HEAD"
          echo "mode=commit" >> "${GITHUB_OUTPUT}"
          echo "pr_number=" >> "${GITHUB_OUTPUT}"
        fi
        if [[ -f .gitignore ]]; then
          sed -i '/^\.gemini\/$/d; /^\.agents\/$/d' .gitignore
        fi
        mkdir -p .gemini
        git diff --name-only --diff-filter=ACMRT "${DIFF_RANGE}" -- '*.kt' > .gemini/target_files.txt
        git diff -U5 --diff-filter=ACMRT "${DIFF_RANGE}" -- '*.kt' > .gemini/pr_diff.patch
        # Every added line prefixed with `path:line:` so the model can report exact new-file line
        # numbers, which are needed to anchor inline review comments.
        git diff -U0 --diff-filter=ACMRT "${DIFF_RANGE}" -- '*.kt' | awk '
          /^\+\+\+ b\// { file = substr($0, 7); next }
          /^@@/ { match($0, /\+[0-9]+/); line = substr($0, RSTART + 1, RLENGTH - 1) + 0; next }
          /^\+/ { printf "%s:%d: %s\n", file, line, substr($0, 2); line++ }
        ' > .gemini/added_lines.txt
        FILE_COUNT=$(grep -c '\.kt$' .gemini/target_files.txt || true)
        echo "file_count=${FILE_COUNT}" >> "${GITHUB_OUTPUT}"
        echo "Found ${FILE_COUNT} modified Kotlin file(s) to audit."

    - name: Mark Review In Progress
      if: steps.context.outputs.pr_number != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REVIEW_PHASE: start
        PR_NUMBER: ${{ steps.context.outputs.pr_number }}
      with:
        github-token: ${{ secrets.PAT || github.token }}
        script: |
          const review = require('./.github/scripts/compose_performance_review.js');
          await review({ github, context, core });

    - name: Install Jetpack Compose Performance Skill
      if: steps.context.outputs.file_count != '0'
      run: |
        set -euo pipefail
        curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
        export PATH="${HOME}/.local/bin:${PATH}"
        android skills add --agent=gemini --project=. jetpack-compose-performance

    - name: Run Jetpack Compose Performance Skill
      if: steps.context.outputs.file_count != '0'
      id: gemini_review
      # The review is advisory. Model capacity errors (503/429) are ignored by the last step so they
      # don't block merges; any other failure still fails the job.
      continue-on-error: true
      uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
      env:
        GEMINI_CLI_TRUST_WORKSPACE: 'true'
        GITHUB_TOKEN: ${{ secrets.PAT || github.token }}
      with:
        gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        github_pr_number: ${{ steps.context.outputs.pr_number }}
        upload_artifacts: 'true'
        settings: |
          {
            "model": {
              "maxSessionTurns": 50
            },
            "context": {
              "fileFiltering": {
                "respectGitIgnore": false,
                "respectGeminiIgnore": false
              }
            },
            "fileFiltering": {
              "respectGitIgnore": false,
              "respectGeminiIgnore": false
            }
          }
        prompt: |
          Use the `jetpack-compose-performance` skill located at `.agents/skills/jetpack-compose-performance/SKILL.md` to review the newly introduced or modified Kotlin code in `.gemini/pr_diff.patch`.

          Follow these instructions strictly:
          1. Read `.agents/skills/jetpack-compose-performance/SKILL.md` first.
          2. Read `.gemini/pr_diff.patch` to identify the exact lines added or modified in this change (`+` lines in the diff hunks). The list of touched Kotlin files is also in `.gemini/target_files.txt`.
          3. You may read the touched Kotlin files listed in `.gemini/target_files.txt` ONLY to understand the surrounding context (such as enclosing `@Composable` functions, state declarations, parameters, or imports) of the changed lines.
          4. **Strict Diff Scope**: Only report Jetpack Compose performance findings on **newly introduced or modified code (`+` lines in `.gemini/pr_diff.patch`)**. Do NOT report findings on pre-existing, untouched code elsewhere in the same file or in other files.
          5. Whenever newly introduced or modified code matches a rule in Categories 1-7, you MUST open and read the corresponding `.agents/skills/jetpack-compose-performance/references/**/*.md` file for the approved fix pattern and scope guards before reporting a finding.
          6. Use `.gemini/added_lines.txt` (format `path:line: content`) to get the exact line numbers of added lines in the new version of each file. Every line number you report MUST be a new-file line number of a `+` line.
          7. Do NOT modify any files in the repository and do NOT run shell commands.
          8. Format your final response EXACTLY as follows, with nothing before or after:
             - A short Markdown overview (2-5 sentences, no headings) of the overall Compose performance health of the change. Do not repeat per-finding details; each finding is posted as an inline comment on the affected lines.
             - Then a single fenced ```json code block containing an object of this shape:
               {
                 "findings": [
                   {
                     "path": "repo-relative/path/to/File.kt",
                     "start_line": 51,
                     "line": 58,
                     "symbol": "EnclosingComposableOrFunctionName",
                     "rule_id": "short-kebab-case-rule-id",
                     "category": "Category N: <category name> (<rule name>)",
                     "severity": "high | medium | low",
                     "title": "One-line summary of the issue",
                     "explanation": "Why this impacts Compose performance (Markdown, 1-3 sentences).",
                     "suggestion": "Exact replacement text for lines start_line..line, or an empty string",
                     "fix_snippet": "Kotlin snippet showing the recommended fix, or an empty string"
                   }
                 ]
               }
             - `line` is the last line of the affected code and `start_line` is the first (omit `start_line` for a single line). Keep the range tight: point at the offending statement(s), not the whole function.
             - Only set `suggestion` when it is a complete, compilable drop-in replacement for exactly lines `start_line`..`line` (preserving indentation); it is rendered as a GitHub suggested change. Otherwise leave it empty and put the recommended code in `fix_snippet`.
             - Use a stable, descriptive `rule_id` (for example `defer-animated-alpha-read`) so the same issue gets the same id across runs.
             - If no issues are found, return `{"findings": []}` and say so in the overview.

    - name: Classify Review Failure
      id: classify
      if: steps.gemini_review.outcome == 'failure'
      env:
        GEMINI_ERROR: ${{ steps.gemini_review.outputs.error }}
      run: |
        set -euo pipefail
        if grep -qiE '"code": *(503|429)|status: *(503|429)|high demand|UNAVAILABLE|RESOURCE_EXHAUSTED' <<< "${GEMINI_ERROR}"; then
          echo "capacity_error=true" >> "${GITHUB_OUTPUT}"
        else
          echo "capacity_error=false" >> "${GITHUB_OUTPUT}"
        fi

    # Keeps a single summary comment up to date and posts findings as inline review comments.
    - name: Publish Review on Pull Request
      if: always() && steps.context.outputs.pr_number != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REVIEW_PHASE: finish
        PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        FILE_COUNT: ${{ steps.context.outputs.file_count }}
        REVIEW_OUTCOME: ${{ steps.gemini_review.outcome }}
        CAPACITY_ERROR: ${{ steps.classify.outputs.capacity_error }}
        REVIEW_SUMMARY: ${{ steps.gemini_review.outputs.summary }}
      with:
        github-token: ${{ secrets.PAT || github.token }}
        script: |
          const review = require('./.github/scripts/compose_performance_review.js');
          await review({ github, context, core });

    - name: Ignore Model Capacity Errors
      if: steps.gemini_review.outcome == 'failure'
      env:
        CAPACITY_ERROR: ${{ steps.classify.outputs.capacity_error }}
        GEMINI_ERROR: ${{ steps.gemini_review.outputs.error }}
      run: |
        set -euo pipefail
        if [[ "${CAPACITY_ERROR}" == "true" ]]; then
          echo "::warning title=Compose performance review skipped::The Gemini model is temporarily unavailable (503/429). Re-run this workflow later to get the review."
          exit 0
        fi
        echo "::error title=Compose performance review failed::The Gemini CLI failed for a reason other than model capacity."
        printf '%s\n' "${GEMINI_ERROR}"
        exit 1
