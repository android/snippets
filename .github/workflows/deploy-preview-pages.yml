name: Deploy Compose Previews to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'compose/**'
      - 'preview/**'
      - '.github/workflows/deploy-preview-pages.yml'
  pull_request:
    paths:
      - 'compose/**'
      - 'preview/**'
      - '.github/workflows/deploy-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT || github.token }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow for Screenshot Generation
        run: pip install Pillow

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Preview Screenshots
        run: |
          ./preview/generator/scripts/run-preview-daemon.sh

      - name: Build WASM & Assemble Static Website
        run: |
          ./gradlew :preview:wasm:packageStaticSite --stacktrace

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview/wasm/build/dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
