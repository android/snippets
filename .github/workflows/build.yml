name: Build snippets

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        token: ${{ secrets.PAT || github.token }}
        persist-credentials: false
    - name: set up Java 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'zulu'
        java-version: '25'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
    - name: Compile, Test & Lint Debug
      run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest testAndroidHostTest testClasses lintDebug spotlessCheck --stacktrace
    - name: Build Watch Face Push validation snippets
      run: ./gradlew :watchfacepush:validator:run --stacktrace
