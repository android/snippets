name: Update Versions / Dependencies

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Update dependencies
        run: ./gradlew versionCatalogUpdate
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.PAT }}
          commit-message: 🤖 Update Dependencies
          committer: compose-devrel-github-bot <compose-devrel-github-bot@google.com>
          author: compose-devrel-github-bot <compose-devrel-github-bot@google.com>
          signoff: false
          branch: bot-update-deps
          delete-branch: true
          title: '🤖 Update Dependencies'
          body: Updated dependencies
          reviewers: ${{ github.actor }}